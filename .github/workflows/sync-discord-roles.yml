name: Sync Discord Roles

on:
  schedule:
    # รันทุก 10 นาที (GitHub อาจดีเลย์เพิ่มอีกเล็กน้อยช่วงโหลดสูง เป็นเรื่องปกติของ free tier)
    - cron: "*/10 * * * *"
  workflow_dispatch: {} # กดรันเองได้จากแท็บ Actions บน GitHub ทันที ไม่ต้องรอรอบ

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install dependencies
        run: npm install

      - name: Run role sync
        env:
          FIREBASE_SERVICE_ACCOUNT_JSON: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_JSON }}
          DISCORD_BOT_TOKEN: ${{ secrets.DISCORD_BOT_TOKEN }}
        run: npm run sync
